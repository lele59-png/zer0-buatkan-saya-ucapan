<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will you be my girlfriend?</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f9f2f4;
    color: #333;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1rem;
  }
  h2 {
    margin-bottom: 1rem;
    font-size: 1.5rem;
    text-align: center;
  }
  .btn {
    font-size: 1.2rem;
    padding: 0.8rem 1.5rem;
    margin: 0.5rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.3s, transform 0.2s;
    width: 80%;
    max-width: 300px;
  }
  .yes {
    background: #28a745;
    color: #fff;
  }
  .yes:hover { background: #218838; }
  .yes:active { transform: scale(0.98); }
  .yes.selected {
    background: #1e7e34;
    pointer-events: none;
  }
  .no {
    background: #dc3545;
    color: #fff;
  }
  .no:hover { background: #c82333; }
  .no:active { transform: scale(0.98); }
  @media (max-width: 480px) {
    h2 { font-size: 1.2rem; }
    .btn { font-size: 1rem; padding: 0.6rem 1.2rem; }
  }
</style>
</head>
<body>
<h2>Will you be my girlfriend?</h2>
<button id="yesBtn" class="btn yes">Yes</button>
<button id="noBtn" class="btn no">No</button>

<script>
  const yesBtn = document.getElementById('yesBtn');
  const noBtn = document.getElementById('noBtn');

  const phrases = [
    'Maybe later',
    'Sure!',
    'Absolutely not',
    'I think yes',
    'Definitely',
    'No way',
    'Perhaps',
    'You bet',
    'Sounds good',
    'Not this time'
  ];

  yesBtn.addEventListener('click', () => {
    yesBtn.textContent = 'Yes';
    yesBtn.classList.add('selected');
  });

  noBtn.addEventListener('click', () => {
    const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
    noBtn.textContent = randomPhrase;
    // optional: change background slightly each time
    noBtn.style.background = `hsl(${Math.random() * 360}, 80%, 50%)`;
  });
</script>
</body>
</html>
